<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamer Info Card Overlay</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: transparent; /* Transparan agar cocok untuk OBS/TikTok Studio */
            color: #ffffff;
            perspective: 1000px;
        }

        .font-header {
            font-family: 'Fredoka', cursive;
        }

        /* RUNNING NEON BORDER ANIMATION */
        .neon-animated-box {
            position: relative;
            overflow: hidden;
            padding: 2.5px;
        }

        .neon-animated-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                transparent, 
                var(--neon-color-1, #a855f7), 
                var(--neon-color-2, #ec4899), 
                var(--neon-color-3, #818cf8), 
                transparent 40%
            );
            animation: rotateNeon 3.5s linear infinite;
        }

        @keyframes rotateNeon {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .neon-inner-card {
            position: relative;
            background: rgba(22, 9, 38, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 1;
        }

        .neon-glow-shadow {
            filter: drop-shadow(0 0 15px var(--neon-glow, rgba(168, 85, 247, 0.6)));
        }

        .neon-text-glow {
            text-shadow: 0 0 8px rgba(192, 132, 252, 0.9),
                         0 0 16px rgba(168, 85, 247, 0.6);
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(4deg); }
        }

        @keyframes floatReverse {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(6px) rotate(-4deg); }
        }

        @keyframes sparkleTwinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.25); }
        }

        @keyframes moonGlow {
            0%, 100% { filter: drop-shadow(0 0 4px #c084fc); }
            50% { filter: drop-shadow(0 0 12px #f472b6); }
        }

        .animate-float {
            animation: floatSlow 3.5s ease-in-out infinite;
        }

        .animate-float-reverse {
            animation: floatReverse 4s ease-in-out infinite;
        }

        .animate-sparkle {
            animation: sparkleTwinkle 2s ease-in-out infinite;
        }

        .animate-moon {
            animation: moonGlow 3s ease-in-out infinite;
        }

        .tilt-card {
            transition: transform 0.15s ease-out;
            transform-style: preserve-3d;
        }

        .click-sparkle {
            position: absolute;
            pointer-events: none;
            animation: burstFade 0.6s ease-out forwards;
            z-index: 50;
        }

        @keyframes burstFade {
            0% { transform: scale(0.3) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.8) rotate(45deg); opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- MAIN CARD DISPLAY AREA -->
    <div class="w-full max-w-sm relative flex justify-center">
        <div id="version-1" class="w-full relative">
            
            <!-- Moon & Stars Overlay Elements -->
            <i class="fa-solid fa-moon text-amber-200 text-3xl absolute -top-5 -left-4 animate-float animate-moon z-20"></i>
            <i class="fa-solid fa-star text-amber-300 text-sm absolute -top-6 left-5 animate-sparkle z-20" style="animation-delay: 0.3s;"></i>
            <i class="fa-solid fa-butterfly text-pink-300 text-2xl absolute -top-5 -right-3 animate-float-reverse z-20"></i>
            <i class="fa-solid fa-sparkles text-purple-300 text-base absolute -bottom-3 -right-2 animate-sparkle z-20" style="animation-delay: 1.1s;"></i>
            <i class="fa-solid fa-star text-purple-300 text-xs absolute bottom-1 -left-3 animate-sparkle z-20" style="animation-delay: 0.7s;"></i>

            <div class="tilt-card neon-glow-shadow">
                <div class="neon-animated-box rounded-3xl cursor-pointer" onclick="createSparkleEffect(event, this)">
                    <div class="neon-inner-card rounded-[1.4rem] p-4 relative overflow-hidden shadow-2xl">
                        
                        <!-- Glow background spots -->
                        <div class="absolute -top-10 -right-10 w-28 h-28 bg-purple-600/30 rounded-full blur-2xl pointer-events-none"></div>
                        <div class="absolute -bottom-10 -left-10 w-28 h-28 bg-pink-600/25 rounded-full blur-2xl pointer-events-none"></div>

                        <!-- Header -->
                        <div class="flex items-center justify-between border-b border-purple-400/30 pb-2.5 mb-3">
                            <div class="flex items-center space-x-2 pl-3">
                                <h2 class="font-header text-base font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-100 via-pink-200 to-white neon-text-glow tracking-wide">
                                    Streamer Info
                                </h2>
                            </div>
                            <span class="text-[9px] font-bold tracking-wider px-2 py-0.5 rounded-full bg-purple-900/60 border border-purple-400/40 text-purple-200 uppercase flex items-center gap-1">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> Live
                            </span>
                        </div>

                        <!-- Info Item Rows -->
                        <div class="space-y-2">
                            
                            <!-- USERNAME -->
                            <div class="group bg-purple-950/40 hover:bg-purple-900/60 p-2 rounded-xl border border-purple-400/30 transition-all flex items-center gap-2.5">
                                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center text-white shadow-md text-xs shrink-0">
                                    <i class="fa-solid fa-user"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-[8px] uppercase font-bold text-purple-300 tracking-wider">Username</p>
                                    <p class="text-xs font-bold text-white truncate neon-text-glow">D E V I C A</p>
                                </div>
                                <i class="fa-solid fa-star text-[10px] text-amber-300/60"></i>
                            </div>

                            <!-- USER ID -->
                            <div onclick="copyUserId(event, '12134703501')" class="group bg-purple-950/40 hover:bg-purple-900/60 p-2 rounded-xl border border-purple-400/30 transition-all flex items-center gap-2.5 cursor-pointer relative" title="Klik untuk menyalin ID">
                                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center text-white shadow-md text-xs shrink-0">
                                    <i class="fa-solid fa-id-card"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-[8px] uppercase font-bold text-purple-300 tracking-wider">User ID</p>
                                    <p class="text-xs font-bold text-pink-200 font-mono truncate">12134703501</p>
                                </div>
                                <i class="fa-solid fa-copy text-[10px] text-purple-400/40 group-hover:text-pink-300"></i>
                                <span class="copy-toast absolute -top-6 right-2 bg-pink-500 text-white text-[9px] px-2 py-0.5 rounded shadow opacity-0 transition-opacity pointer-events-none">Disalin!</span>
                            </div>

                            <!-- SERVER -->
                            <div class="group bg-purple-950/40 hover:bg-purple-900/60 p-2 rounded-xl border border-purple-400/30 transition-all flex items-center gap-2.5">
                                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-fuchsia-600 flex items-center justify-center text-white shadow-md text-xs shrink-0">
                                    <i class="fa-solid fa-globe"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-[8px] uppercase font-bold text-purple-300 tracking-wider">Server</p>
                                    <p class="text-xs font-bold text-purple-100 truncate">Azure Melody</p>
                                </div>
                                <i class="fa-solid fa-moon text-[10px] text-purple-300/40"></i>
                            </div>

                            <!-- GAMES -->
                            <div class="group bg-purple-950/40 hover:bg-purple-900/60 p-2 rounded-xl border border-purple-400/30 transition-all flex items-center gap-2.5">
                                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-fuchsia-500 to-purple-600 flex items-center justify-center text-white shadow-md text-xs shrink-0">
                                    <i class="fa-solid fa-gamepad"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-[8px] uppercase font-bold text-purple-300 tracking-wider">Games</p>
                                    <p class="text-xs font-bold text-fuchsia-200 truncate">Sword Of Justice</p>
                                </div>
                                <i class="fa-solid fa-sparkles text-[10px] text-fuchsia-300/40"></i>
                            </div>

                        </div>

                        <!-- Footer Tagline -->
                        <div class="mt-2.5 pt-1.5 text-center border-t border-purple-500/20">
                            <span class="text-[9px] text-purple-300/80 tracking-wide flex items-center justify-center gap-1">
                                <i class="fa-solid fa-moon text-amber-200 text-[8px]"></i> Chill & Good Vibes <i class="fa-solid fa-star text-amber-300 text-[8px]"></i>
                            </span>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Copy User ID feature
        function copyUserId(e, idText) {
            e.stopPropagation();
            if (navigator.clipboard) {
                navigator.clipboard.writeText(idText);
            } else {
                const el = document.createElement('textarea');
                el.value = idText;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
            }

            const toast = e.currentTarget.querySelector('.copy-toast');
            if(toast) {
                toast.style.opacity = '1';
                setTimeout(() => { toast.style.opacity = '0'; }, 1500);
            }
        }

        // 3D Interactive Tilt Effect on Mousemove
        document.addEventListener('mousemove', (e) => {
            const tiltCards = document.querySelectorAll('.tilt-card');
            const { innerWidth, innerHeight } = window;
            const mouseX = (e.clientX - innerWidth / 2) / (innerWidth / 2);
            const mouseY = (e.clientY - innerHeight / 2) / (innerHeight / 2);
            
            const tiltX = mouseY * -10;
            const tiltY = mouseX * 10;

            tiltCards.forEach(card => {
                card.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
            });
        });

        // Click Sparkle Particle Effect
        function createSparkleEffect(e, card) {
            const rect = card.getBoundingClientRect();
            const sparkle = document.createElement('i');
            sparkle.className = 'fa-solid fa-sparkles click-sparkle text-amber-300 text-base';
            sparkle.style.left = `${e.clientX - rect.left - 8}px`;
            sparkle.style.top = `${e.clientY - rect.top - 8}px`;

            card.appendChild(sparkle);

            setTimeout(() => {
                sparkle.remove();
            }, 600);
        }
    </script>
</body>
</html>
